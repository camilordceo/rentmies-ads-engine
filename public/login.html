<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Rentmies</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #40d99d;
  --teal-dark: #2fb87d;
  --black: #1a1a1a;
  --muted: #6b7280;
  --bg: #fff;
  --bg2: #f8f8f8;
  --border: #e5e5e5;
  --error: #ef4444;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  color: var(--black);
  background: var(--bg2);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
h1, h2, h3, .logo-text { font-family: 'DM Sans', sans-serif; }
a { text-decoration: none; color: inherit; }

/* Nav */
nav {
  height: 60px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 32px;
}
.logo-text { font-size: 17px; font-weight: 600; color: var(--teal); }
.logo-sub { font-size: 11px; color: var(--muted); margin-left: 6px; }

/* Main */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}

.auth-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 4px 24px rgba(0,0,0,.06);
}

.auth-header {
  text-align: center;
  margin-bottom: 32px;
}

.auth-logo {
  width: 44px;
  height: 44px;
  background: var(--teal);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}
.auth-logo svg { stroke: #fff; }

.auth-header h1 {
  font-size: 22px;
  font-weight: 500;
  margin-bottom: 6px;
}
.auth-header p { font-size: 14px; color: var(--muted); }

.form-group { margin-bottom: 18px; }
label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--black);
}
input {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: var(--black);
  outline: none;
  transition: border-color 200ms ease;
  background: #fff;
}
input:hover { border-color: #ccc; }
input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(64,217,157,.15); }

.btn-submit {
  width: 100%;
  height: 44px;
  background: var(--teal);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: background 200ms ease;
  margin-top: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-submit:hover { background: var(--teal-dark); }
.btn-submit:focus { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn-submit:disabled { opacity: .6; cursor: not-allowed; }

.error-msg {
  display: none;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: var(--error);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 16px;
  line-height: 1.5;
}
.error-msg.show { display: block; }

.auth-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 13px;
  color: var(--muted);
}
.auth-footer a { color: var(--teal); font-weight: 500; }
.auth-footer a:hover { text-decoration: underline; }

/* Demo mode (when Supabase is not configured) */
.demo-banner {
  display: none;
  background: #fff8e1;
  border: 1px solid #ffe082;
  color: #8a6d00;
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 12px;
  line-height: 1.5;
  margin-bottom: 16px;
}
.demo-banner.show { display: block; }
.btn-demo {
  width: 100%;
  height: 44px;
  background: #fff;
  color: var(--black);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  margin-top: 12px;
  transition: border-color 200ms ease, background 200ms ease;
}
.btn-demo:hover { border-color: var(--teal); background: #f8fffd; }

/* Spinner */
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}
.spinner.show { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Loading overlay */
#authOverlay {
  display: flex;
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 999;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  color: var(--muted);
  font-size: 14px;
}
</style>
</head>
<body>

<div id="authOverlay">Verificando sesión…</div>

<nav>
  <a href="/">
    <span class="logo-text">rentmies</span><span class="logo-sub">Growth Suite</span>
  </a>
</nav>

<main>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Bienvenido de vuelta</h1>
      <p>Inicia sesión en tu cuenta de Rentmies</p>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <div id="demoBanner" class="demo-banner">
      Supabase aún no está configurado en este entorno. Puedes entrar en <strong>modo demo</strong> para revisar el dashboard.
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@inmobiliaria.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Iniciar sesión</span>
      </button>

      <button type="button" class="btn-demo" id="demoBtn" style="display:none" onclick="enterDemoMode()">
        Entrar en modo demo →
      </button>
    </form>

    <div class="auth-footer">
      ¿No tienes cuenta? <a href="/signup">Crea una gratis</a>
    </div>
  </div>
</main>

<script>
  // ── Supabase config ──────────────────────────────────────────
  let SUPABASE_URL = ''
  let SUPABASE_ANON_KEY = ''

  async function loadConfig() {
    try {
      const r = await fetch('/api/auth-supabase?action=config')
      const cfg = await r.json()
      SUPABASE_URL = cfg.supabaseUrl || ''
      SUPABASE_ANON_KEY = cfg.supabaseAnonKey || ''
    } catch (_) {}

    // If Supabase is not configured, surface the demo entry point so the
    // dashboard is still reachable without credentials.
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      document.getElementById('demoBanner').classList.add('show')
      document.getElementById('demoBtn').style.display = 'block'
    }
  }

  function enterDemoMode() {
    const demoToken = 'demo_' + Date.now().toString(36)
    localStorage.setItem('sb_token', demoToken)
    localStorage.setItem('sb_user', JSON.stringify({ id: 'demo-user', email: 'demo@rentmies.com' }))
    window.location.replace('/app')
  }

  // ── Check existing session ───────────────────────────────────
  async function checkExistingSession() {
    const token = sessionStorage.getItem('sb_token') || localStorage.getItem('sb_token')
    if (!token) {
      hideOverlay()
      return
    }
    try {
      const r = await fetch('/api/auth-supabase?action=me', {
        headers: { Authorization: `Bearer ${token}` }
      })
      if (r.ok) {
        window.location.replace('/app')
        return
      }
    } catch (_) {}
    // Token invalid — clear and show form
    localStorage.removeItem('sb_token')
    sessionStorage.removeItem('sb_token')
    hideOverlay()
  }

  function hideOverlay() {
    document.getElementById('authOverlay').style.display = 'none'
  }

  // ── Handle login ─────────────────────────────────────────────
  async function handleLogin(e) {
    e.preventDefault()
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const errEl = document.getElementById('errorMsg')
    const btn = document.getElementById('submitBtn')
    const spinner = document.getElementById('spinner')
    const btnText = document.getElementById('btnText')

    errEl.classList.remove('show')
    btn.disabled = true
    spinner.classList.add('show')
    btnText.textContent = 'Iniciando sesión…'

    try {
      const r = await fetch('/api/auth-supabase?action=signin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
      const data = await r.json()

      if (!r.ok) {
        showError(data.error || 'Error al iniciar sesión')
        return
      }

      if (data.session?.access_token) {
        localStorage.setItem('sb_token', data.session.access_token)
        localStorage.setItem('sb_refresh_token', data.session.refresh_token || '')
        localStorage.setItem('sb_user', JSON.stringify({ id: data.user.id, email: data.user.email }))
      }

      window.location.replace('/app')
    } catch (err) {
      showError('Error de conexión. Intenta de nuevo.')
    } finally {
      btn.disabled = false
      spinner.classList.remove('show')
      btnText.textContent = 'Iniciar sesión'
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg')
    el.textContent = msg
    el.classList.add('show')
  }

  // ── Init ─────────────────────────────────────────────────────
  loadConfig().then(checkExistingSession)

  // Keyboard: Enter submits
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
      document.getElementById('loginForm').requestSubmit()
    }
  })
</script>
</body>
</html>
