<script>
  // Mobile FAB toggles the right panel; topbar toggle hides/shows it on desktop (persisted).
  document.addEventListener('DOMContentLoaded', () => {
    const app    = document.querySelector('.ae-app')
    const fab    = document.getElementById('rp-fab')
    const panel  = document.querySelector('.rp-panel, .ae-camilord')
    const toggle = document.getElementById('rp-panel-toggle')
    const STORAGE_KEY = 'rp:panel:collapsed'

    function applyState(collapsed) {
      if (!app) return
      app.classList.toggle('rp-panel-collapsed', collapsed)
      if (toggle) toggle.setAttribute('aria-pressed', String(!collapsed))
      try { localStorage.setItem(STORAGE_KEY, collapsed ? '1' : '0') } catch (_) {}
    }

    let initialCollapsed = false
    try { initialCollapsed = localStorage.getItem(STORAGE_KEY) === '1' } catch (_) {}
    applyState(initialCollapsed)

    if (toggle && app) {
      toggle.addEventListener('click', () => {
        applyState(!app.classList.contains('rp-panel-collapsed'))
      })
    }

    if (fab && panel) {
      fab.addEventListener('click', () => {
        panel.classList.toggle('rp-panel-open')
      })
    }
  })
</script>
