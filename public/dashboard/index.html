<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdEngine AI — Rentmies</title>

  <!-- Fonts: Inter (UI) + Instrument Serif italic (editorial) + JetBrains Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Foundation CSS (order matters: tokens → typography → layout → buttons → cards-forms) -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/rail.css">
  <link rel="stylesheet" href="css/topnav.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/cards-forms.css">
</head>
<body>

<div class="ae-app">

  <!-- ═══════════ LEFT RAIL ═══════════ -->
  <aside class="ae-rail">
    <div class="ae-rail-logo" title="Camilord — Rentmies AdEngine">C</div>

    <button class="ae-rail-link active" data-route="studio" title="Creative Studio" aria-label="Creative Studio">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>

    <button class="ae-rail-link" data-route="parrilla" title="Parrilla / Schedule" aria-label="Parrilla">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </button>

    <button class="ae-rail-link" data-route="creatives" title="Creatives Library" aria-label="Creatives">
      <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
    </button>

    <button class="ae-rail-link" data-route="analytics" title="Analytics" aria-label="Analytics">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </button>

    <div class="ae-rail-spacer"></div>

    <div class="ae-rail-divider"></div>

    <button class="ae-rail-link" data-route="settings" title="Settings / Credenciales" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>

    <div class="ae-rail-avatar" title="Camilo Rodríguez · camilo@rentmies.com">CR</div>
  </aside>

  <!-- ═══════════ MAIN CANVAS ═══════════ -->
  <main class="ae-canvas">
    <header class="ae-topnav">
      <div class="ae-topnav-logo">AdEngine AI</div>

      <nav class="ae-topnav-nav">
        <button class="ae-topnav-link active" data-page="studio" onclick="showPage('studio')">Creative Studio</button>
        <button class="ae-topnav-link" data-page="dashboard" onclick="showPage('dashboard')">Dashboard</button>
        <button class="ae-topnav-link" data-page="history" onclick="showPage('history')">History</button>
      </nav>

      <div class="ae-topnav-spacer"></div>

      <div class="ae-search">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Buscar campañas...">
      </div>

      <button class="ae-launch-btn" onclick="showPage('studio')" title="Lanzar nueva campaña">
        <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>Lanzar Campaña</span>
      </button>
    </header>

    <div class="ae-content hide-scrollbar">
      <div class="ae-page">
        <!-- Page content will be wired in step 10 -->
      </div>
    </div>
  </main>

  <!-- ═══════════ RIGHT CAMILORD PANEL ═══════════ -->
  <aside class="ae-camilord">
    <!-- populated in step 7 -->
  </aside>

</div>

</body>
</html>
